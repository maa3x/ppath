version: '2'
run:
  modules-download-mode: readonly
output:
  sort-order:
    - severity
    - linter
    - file
linters:
  default: all
  disable:
    - cyclop
    - errcheck
    - exhaustruct
    - gocyclo
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    embeddedstructfieldcheck:
      empty-line: false
      forbid-mutex: true
    cyclop:
      max-complexity: 15
    decorder:
      ignore-underscore-vars: true
      dec-order:
        - const
        - var
        - type
        - func
    dupl:
      threshold: 150
    errchkjson:
      check-error-free-encoding: true
      report-no-exported: true
    errorlint:
      asserts: false
    exhaustive:
      check:
        - switch
        - map
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: ^print(ln)?$
        - pattern: ^fmt\.Print.*$
        - pattern: ^log\..*$
    funlen:
      lines: 250
      statements: 60
    goconst:
      min-len: 3
      min-occurrences: 4
    gocritic:
      disabled-checks:
        - whyNoLint
      enable-all: true
    gocyclo:
      min-complexity: 30
    godoclint:
      default: all
      options:
        max-len:
          length: 110
      disable:
        - require-pkg-doc
        - require-doc
    godox:
      keywords:
        - FIXME
        - TODO
    gosec:
      excludes:
        - G115
        - G306
        - G307
        - G401
        - G404
        - G501
    govet:
      enable-all: true
      disable:
        - shadow
    iface:
      enable:
        - identical # Identifies interfaces in the same package that have identical method sets.
        - unused # Identifies interfaces that are not used anywhere in the same package where the interface is defined.
        - opaque # Identifies functions that return interfaces, but the actual returned value is always a single concrete implementation.
        - unexported # Identifies interfaces that are not exported but are used in exported functions or methods.
    lll:
      line-length: 200
    misspell:
      locale: US
    mnd:
      checks:
        - argument
        - case
        - condition
        - return
      ignored-numbers:
        - '0'
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
        - '10'
        - '32'
        - '100'
        - '0o400'
        - '0o600'
        - '0o644'
        - '0o755'
        - '1e3'
        - '1e4'
        - '1e6'
        - '1e9'
      ignored-functions:
        - (.*).IntRange
        - int
        - int16
        - int32
        - int64
        - int8
        - make
        - rune
        - strings.SplitN
        - uint
        - uint16
        - uint32
        - uint64
        - uint8
    nilnil:
      detect-opposite: true
    nolintlint:
      require-explanation: false
      require-specific: true
      allow-unused: false
    revive:
      rules:
        - name: argument-limit
          arguments:
            - 5
        - name: atomic
        - name: blank-imports
        - name: bool-literal-in-expr
        - name: call-to-gc
        - name: comment-spacings
        - name: confusing-naming
        - name: confusing-results
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: datarace
        - name: deep-exit
        - name: defer
        - name: dot-imports
        - name: duplicated-imports
        - name: early-return
        - name: empty-block
        - name: enforce-map-style
          arguments:
            - make
        - name: enforce-repeated-arg-type-style
          arguments:
            - short
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: function-result-limit
          arguments:
            - 3
        - name: get-return
        - name: identical-branches
        - name: identical-ifelseif-branches
        - name: identical-ifelseif-conditions
        - name: identical-switch-branches
        - name: identical-switch-conditions
        - name: if-return
        - name: import-shadowing
        - name: increment-decrement
        - name: indent-error-flow
        - name: max-control-nesting
          arguments:
            - 4
        - name: modifies-parameter
        - name: nested-structs
        - name: modifies-value-receiver
        - name: optimize-operands-order
        - name: package-directory-mismatch
        - name: range
        - name: range-val-address
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: redundant-import-alias
        - name: redundant-test-main-exit
        - name: string-format
        - name: string-of-int
        - name: struct-tag
        - name: superfluous-else
        - name: time-date
        - name: time-equal
        - name: time-naming
        - name: unchecked-type-assertion
        - name: unconditional-recursion
        - name: unexported-return
          disabled: true
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: unused-parameter
        - name: unused-receiver
          disabled: true
        - name: use-any
        - name: use-waitgroup-go
        - name: useless-break
        - name: useless-fallthrough
        - name: waitgroup-by-value
    spancheck:
      checks:
        - end
        - record-error
        - set-status
    tagalign:
      align: true
      sort: true
      strict: false
    tagliatelle:
      case:
        rules:
          json: snake
    varnamelen:
      max-distance: 10
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/maa3x/ppath
      extra-rules: true
