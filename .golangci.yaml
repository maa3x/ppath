version: '2'
run:
  modules-download-mode: readonly
output:
  sort-order:
    - severity
    - linter
    - file
linters:
  default: all
  disable:
    - cyclop
    - dogsled
    - err113
    - exhaustive
    - exhaustruct
    - exhaustruct_v5
    - gochecknoglobals
    - gocyclo
    - gomodguard
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - varnamelen
    - wsl
    - wsl_v5
    - wrapcheck
  settings:
    embeddedstructfieldcheck:
      empty-line: false
      forbid-mutex: true
    cyclop:
      max-complexity: 15
    decorder:
      ignore-underscore-vars: true
      dec-order:
        - const
        - var
        - type
        - func
    depguard:
      rules:
        logger:
          deny:
            - pkg: github.com/sirupsen/logrus
              desc: logging is allowed only by zap.
            - pkg: github.com/pkg/errors
              desc: Should be replaced by standard lib errors package.
    dupl:
      threshold: 250
    errchkjson:
      check-error-free-encoding: true
      report-no-exported: true
    errorlint:
      asserts: false
    exhaustive:
      check:
        - switch
        - map
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: ^print(ln)?$
        - pattern: ^fmt\.Print.*$
    funlen:
      lines: 250
      statements: 75
    gocognit:
      min-complexity: 40
    goconst:
      min-len: 3
      min-occurrences: 7
    gocritic:
      disabled-checks:
        - whyNoLint
      settings:
        hugeParam:
          sizeThreshold: 176
      enable-all: true
    godoclint:
      default: all
      options:
        max-len:
          length: 120
      disable:
        - require-pkg-doc
        - require-doc
    godox:
      keywords:
        - FIXME
        - TODO
    gosec:
      excludes:
        - G115
        - G306
        - G307
        - G401
        - G404
        - G501
    govet:
      enable-all: true
      disable:
        - fieldalignment
    iface:
      enable:
        - identical # Identifies interfaces in the same package that have identical method sets.
        - unused # Identifies interfaces that are not used anywhere in the same package where the interface is defined.
        - opaque # Identifies functions that return interfaces, but the actual returned value is always a single concrete implementation.
        - unexported # Identifies interfaces that are not exported but are used in exported functions or methods.
    ireturn:
      allow:
        - generic
        - error
        - any
        - anon
        - empty
        - stdlib
    lll:
      line-length: 200
    misspell:
      locale: US
    mnd:
      checks:
        - argument
        - case
        - condition
        - return
      ignored-numbers:
        - '0'
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
        - '10'
        - '32'
        - '100'
        - '0o400'
        - '0o600'
        - '0o644'
        - '0o755'
        - '1e3'
        - '1e4'
        - '1e6'
        - '1e9'
      ignored-functions:
        - (.*).IntRange
        - helpers.Chance
        - int
        - int16
        - int32
        - int64
        - int8
        - make
        - rune
        - strings.SplitN
        - uint
        - uint16
        - uint32
        - uint64
        - uint8
    nestif:
      min-complexity: 6
    nilnil:
      detect-opposite: true
    nolintlint:
      require-explanation: false
      require-specific: true
      allow-unused: false
    revive:
      enable-all-rules: true
      rules:
        - name: add-constant
          disabled: true
        - name: argument-limit
          arguments:
            - 5
        - name: confusing-naming
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: enforce-map-style
          arguments:
            - make
        - name: enforce-repeated-arg-type-style
          arguments:
            - short
        - name: exported
          arguments:
            - disable-stuttering-check
        - name: function-result-limit
          arguments:
            - 3
        - name: function-length
          disabled: true
        - name: import-shadowing
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: unexported-return
          disabled: true
        - name: unhandled-error
          disabled: true
        - name: unused-receiver
          disabled: true
    spancheck:
      checks:
        - end
        - record-error
        - set-status
    tagalign:
      align: true
      sort: true
      strict: false
    tagliatelle:
      case:
        rules:
          json: snake
    wrapcheck:
      ignore-package-globs:
        - github.com/maa3x/errz
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
        - pattern: '(a)'
          replacement: 'a'
        - pattern: 'a[b:len(a)]'
          replacement: 'a[b:]'
        - pattern: 'strings.Replace(a, b, c, -1)'
          replacement: 'strings.ReplaceAll(a, b, c)'
        - pattern: 'bytes.Compare(a, b) == 0'
          replacement: 'bytes.Equal(a, b)'
        - pattern: 'bytes.Compare(a, b) != 0'
          replacement: '!bytes.Equal(a, b)'
    gofumpt:
      module-path: github.com/maa3x/ppath
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    goimports:
      local-prefixes:
        - github.com/maa3x/ppath
  exclusions:
    generated: lax
    paths:
      - (.+)_test\.go
      - third_party$
      - builtin$
      - examples$
